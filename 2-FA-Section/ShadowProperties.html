<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border:2px solid green;
            background-color: chartreuse;
            width:100px;
            height: 100px;
            box-shadow:   10px 20px 10px 10px grey;
        }
        p{
            text-shadow: 3px 2px 2px  green;
        }
    </style>
</head>
<body>
    <h1>Box Shadow</h1>
    <div class="box"></div>
    <h1>Text Shadow</h1>
    <p>Bye</p>
</body>
</html>
