<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .divone p{
            color: red;
        }
        .divtwo >p{
            background-color: blue;
            color: white;
        } 
        .headone + p{
            color: blueviolet;
        }
        .headtwo ~ p{
            background-color: yellow;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Combinators</h1>
    <h1>1. Descendant Combinator (space)</h1>
    <div class="divone">
        <p>Paragraph 1</p>
        <section>
            <p>Paragraph 2</p>
            <div>
                <p>Paragraph 3</p>
            </div>
        </section>
    </div>
    <p>Paragraph 4</p>



    <h1>2. Child Combinator</h1>
        <div class="divtwo">
        <p>Paragraph 1</p>
        <section>
            <p>Paragraph 2</p>
            <div>
                <p>Paragraph 3</p>
            </div>
        </section>
    </div>
    <p>Paragraph 4</p>

    <h1>3. Adjacent Sibling Combinator</h1>
    <h1 class="headone">Pari</h1>
    <p>Sanskrati</p>
    <p>Yuvika</p>

    

    <h1>4. General Sibling Combinator</h1>
    <h1 class="headtwo">Hello</h1>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
</body>
</html>
