            width:100px;

        }
        .fixed{

            width:100px;

            position:fixed;
        }
        .sticky{
            border: 2px solid red;
            background-color: rgb(0, 255, 30);
            width:100px;
            height: 80px; 
            position:sticky;
            top:70px;
        }
    </style>
</head>
